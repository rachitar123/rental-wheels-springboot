<!DOCTYPE html>
<html th:fragment="layout (content)"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>RentWheels - Enterprise Portal</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="app-container">
    <!-- Dark Sidebar (Matching Java Swing Sidebar) -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <h2>RentWheels</h2>
            <p>Enterprise Portal</p>
        </div>

        <!-- User Profile Card -->
        <div class="user-card">
            <div class="welcome">Welcome,</div>
            <div class="name" th:text="${currentUserName != null ? currentUserName : 'System Operator'}">System Operator</div>
            <div class="role-badge" sec:authorize="hasRole('ADMIN')">ADMIN</div>
            <div class="role-badge" sec:authorize="hasRole('EMPLOYEE')">EMPLOYEE</div>
        </div>

        <!-- Navigation Menu Links -->
        <nav class="sidebar-nav">
            <a th:href="@{/dashboard}" class="nav-item" th:classappend="${activeTab == 'dashboard'} ? 'active'">
                Dashboard
            </a>
            <a th:href="@{/vehicles}" class="nav-item" th:classappend="${activeTab == 'vehicles'} ? 'active'">
                Vehicles
            </a>
            <a th:href="@{/customers}" class="nav-item" th:classappend="${activeTab == 'customers'} ? 'active'">
                Customers
            </a>
            <a th:href="@{/rentals}" class="nav-item" th:classappend="${activeTab == 'rent_vehicle'} ? 'active'">
                Rent Vehicle
            </a>
            <a th:href="@{/returns}" class="nav-item" th:classappend="${activeTab == 'return_vehicle'} ? 'active'">
                Return Vehicle
            </a>
            <a th:href="@{/billing}" class="nav-item" th:classappend="${activeTab == 'billing'} ? 'active'">
                Billing &amp; Receipts
            </a>
            <!-- Restricted to ADMIN role -->
            <a th:href="@{/reports}" sec:authorize="hasRole('ADMIN')" class="nav-item" th:classappend="${activeTab == 'reports'} ? 'active'">
                Reports Analytics
            </a>
        </nav>

        <!-- Sidebar Bottom Footer Controls -->
        <div class="sidebar-footer">
            <button id="themeToggleBtn" type="button" class="btn btn-dark btn-block">Toggle Theme</button>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-danger btn-block">Sign Out</button>
            </form>
        </div>
    </aside>

    <!-- Main Content Body Area -->
    <main class="main-content">
        <!-- Flash Alert Messages -->
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <!-- Page Specific Content Fragment -->
        <div th:replace="${content}"></div>
    </main>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
