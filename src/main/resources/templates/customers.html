<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::content})}">
<body>
<div th:fragment="content">
    <div class="page-header">
        <h1 class="page-title">Customer Management</h1>
        <div style="width: 250px;">
            <input type="text" class="form-control table-search-input" data-target-table="customersTable" placeholder="Search Customers...">
        </div>
    </div>

    <!-- Search Form -->
    <div class="panel-card" style="padding: 1rem; margin-bottom: 1rem;">
        <form th:action="@{/customers}" method="get" style="display: flex; gap: 1rem; align-items: center;">
            <div style="flex: 1;">
                <input type="text" name="search" th:value="${searchQuery}" class="form-control" placeholder="Search by ID, Name, Phone, or Email">
            </div>
            <button type="submit" class="btn btn-primary">Search</button>
            <a th:href="@{/customers}" class="btn btn-secondary">Reset</a>
        </form>
    </div>

    <div class="split-layout">
        <!-- Form Container (Left) -->
        <div class="panel-card">
            <h3 id="customerFormTitle" style="margin-bottom: 1rem;">Customer Details</h3>
            <form id="customerForm" th:action="@{/customers/add}" method="post">
                <div class="form-group">
                    <label for="id">Customer ID</label>
                    <input type="text" id="id" name="id" class="form-control" placeholder="e.g. CUST001" required>
                </div>

                <div class="form-group">
                    <label for="name">Customer Name</label>
                    <input type="text" id="name" name="name" class="form-control" placeholder="Full Name" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="text" id="phone" name="phone" class="form-control" placeholder="e.g. 0300-1234567" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address (Optional)</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="e.g. ali@domain.com">
                </div>

                <div class="form-group">
                    <label for="driverLicense">Driver License</label>
                    <input type="text" id="driverLicense" name="driverLicense" class="form-control" placeholder="License Number" required>
                </div>

                <div class="btn-grid" style="margin-top: 1.2rem;">
                    <button type="submit" id="addCustomerBtn" class="btn btn-success">Add Customer</button>
                    <button type="button" id="updateCustomerBtn" class="btn btn-primary" onclick="submitCustomerUpdate()">Update</button>
                    <button type="button" id="deleteCustomerBtn" class="btn btn-danger" onclick="submitCustomerDelete()">Delete</button>
                    <button type="button" class="btn btn-secondary" onclick="clearCustomerForm()">Clear</button>
                </div>
            </form>
        </div>

        <!-- Table Container (Right) -->
        <div class="panel-card">
            <div class="table-container">
                <table class="table" id="customersTable">
                    <thead>
                    <tr>
                        <th>Customer ID</th>
                        <th>Customer Name</th>
                        <th>Phone Number</th>
                        <th>Email</th>
                        <th>Driver License</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="c : ${customers}"
                        style="cursor: pointer;"
                        th:onclick="selectCustomerRow([[${c.id}]], [[${c.name}]], [[${c.phone}]], [[${c.email}]], [[${c.driverLicense}]])">
                        <td th:text="${c.id}">CUST101</td>
                        <td th:text="${c.name}">Ali Ahmed</td>
                        <td th:text="${c.phone}">0300-1234567</td>
                        <td th:text="${c.email}">ali@example.com</td>
                        <td th:text="${c.driverLicense}">AP-872A</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(customers)}">
                        <td colspan="5" style="text-align: center; color: var(--text-muted);">No customers found.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function selectCustomerRow(id, name, phone, email, dl) {
            document.getElementById('id').value = id;
            document.getElementById('id').readOnly = true;
            document.getElementById('name').value = name;
            document.getElementById('phone').value = phone;
            document.getElementById('email').value = email || '';
            document.getElementById('driverLicense').value = dl;

            document.getElementById('customerFormTitle').textContent = 'Edit Customer: ' + id;
        }

        function clearCustomerForm() {
            document.getElementById('id').value = '';
            document.getElementById('id').readOnly = false;
            document.getElementById('name').value = '';
            document.getElementById('phone').value = '';
            document.getElementById('email').value = '';
            document.getElementById('driverLicense').value = '';
            document.getElementById('customerFormTitle').textContent = 'Customer Details';
        }

        function submitCustomerUpdate() {
            const form = document.getElementById('customerForm');
            form.action = '/customers/update';
            form.submit();
        }

        function submitCustomerDelete() {
            const id = document.getElementById('id').value;
            if (!id) {
                alert('Please select a customer from the table first.');
                return;
            }
            if (confirm('Are you sure you want to delete customer ' + id + '? Associated rentals will also be removed.')) {
                submitPostWithCsrf('/customers/delete/' + id);
            }
        }
    </script>
</div>
</body>
</html>
