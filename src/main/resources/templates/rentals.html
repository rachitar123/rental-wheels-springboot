<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::content})}">
<body>
<div th:fragment="content">
    <div class="page-header">
        <h1 class="page-title">Book Vehicle Rental</h1>
    </div>

    <div style="max-width: 650px; margin: 0 auto;">
        <div class="panel-card">
            <h2 style="text-align: center; margin-bottom: 1.5rem; color: var(--color-primary);">Book Vehicle Rental</h2>

            <form th:action="@{/rentals/book}" method="post">
                <div class="form-group">
                    <label for="rentalCustomerSelect">Customer</label>
                    <select id="rentalCustomerSelect" name="customerId" class="form-control" required>
                        <option value="">-- Select Customer --</option>
                        <option th:each="c : ${customers}"
                                th:value="${c.id}"
                                th:text="${c.id + ' - ' + c.name}">CUST101 - Ali Ahmed</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="rentalVehicleSelect">Available Vehicle</label>
                    <select id="rentalVehicleSelect" name="vehicleId" class="form-control" required>
                        <option value="">-- Select Vehicle --</option>
                        <option th:each="v : ${vehicles}"
                                th:value="${v.vehicleId}"
                                th:attr="data-rate=${v.rentPerDay}"
                                th:text="${v.vehicleId + ' - ' + v.vehicleName + ' (Rs. ' + v.rentPerDay + '/day)'}">101 - Toyota Corolla</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="rentalDateInput">Rental Date</label>
                    <input type="date" id="rentalDateInput" name="rentalDate" class="form-control" th:value="${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}" required>
                </div>

                <div class="form-group">
                    <label for="returnDateInput">Expected Return Date</label>
                    <input type="date" id="returnDateInput" name="expectedReturnDate" class="form-control" required>
                </div>

                <input type="hidden" id="hiddenDaysInput" name="days" value="1">

                <!-- Dynamic Calculation Labels (Matching RentPanel) -->
                <div style="text-align: center; margin: 1.5rem 0; padding: 1rem; background-color: rgba(33, 150, 243, 0.05); border-radius: var(--radius-sm);">
                    <div id="calculatedDaysLabel" style="font-size: 1.1rem; font-weight: 600;">Total Days: 1</div>
                    <div id="calculatedTotalLabel" style="font-size: 1.3rem; font-weight: 700; color: var(--color-success); margin-top: 0.3rem;">Calculated Rent: Rs. 0.00</div>
                </div>

                <div class="btn-grid">
                    <button type="submit" class="btn btn-primary btn-block">Confirm Booking</button>
                    <a th:href="@{/rentals}" class="btn btn-secondary btn-block">Refresh Options</a>
                </div>
            </form>
        </div>

        <!-- Recent Rentals Reference List -->
        <div class="panel-card" style="margin-top: 1.5rem;">
            <h3 style="margin-bottom: 1rem;">Recent Rental Transactions</h3>
            <div class="table-container">
                <table class="table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Customer</th>
                        <th>Vehicle</th>
                        <th>Status</th>
                        <th>Total Rent</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="r : ${recentRentals}">
                        <td th:text="${'#' + r.id}">#1</td>
                        <td th:text="${r.customer.name}">Ali Ahmed</td>
                        <td th:text="${r.vehicle.vehicleName}">Toyota Corolla</td>
                        <td>
                            <span th:if="${r.status == 'ACTIVE'}" class="badge badge-active">ACTIVE</span>
                            <span th:if="${r.status == 'RETURNED'}" class="badge badge-returned">RETURNED</span>
                        </td>
                        <td th:text="${'Rs. ' + #numbers.formatDecimal(r.totalRent, 1, 2)}">Rs. 5000.00</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(recentRentals)}">
                        <td colspan="5" style="text-align: center; color: var(--text-muted);">No rental history available.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const returnInput = document.getElementById('returnDateInput');
            if (returnInput && !returnInput.value) {
                const target = new Date();
                target.setDate(target.getDate() + 3);
                returnInput.value = target.toISOString().split('T')[0];
            }
        });
    </script>
</div>
</body>
</html>
